<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>샤오홍슈 중국 트렌드 브리핑</title>
<style>
:root{--red:#ff2442;--ink:#1d1d1f;--sub:#6e6e73;--line:#e8e8ed;--bg:#f6f6f8;--card:#fff}
*{box-sizing:border-box}
body{margin:0;word-break:keep-all;overflow-wrap:break-word;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR",sans-serif;background:var(--bg);color:var(--ink);line-height:1.55}
header{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.wrap{max-width:960px;margin:0 auto;padding:0 18px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0}
h1{font-size:19px;margin:0;display:flex;align-items:center;gap:8px}
h1 .logo{background:var(--red);color:#fff;border-radius:6px;padding:2px 7px;font-size:13px}
select{font-size:14px;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:#fff}
nav{display:flex;gap:6px;overflow-x:auto;padding-bottom:10px}
nav a{white-space:nowrap;font-size:13px;color:var(--sub);text-decoration:none;padding:4px 10px;border-radius:999px;background:var(--bg)}
nav a:hover{color:var(--red)}
section{background:var(--card);border-radius:14px;padding:18px 20px;margin:16px 0;border:1px solid var(--line);scroll-margin-top:110px}
h2{font-size:16px;margin:0 0 12px}
ul{margin:0;padding-left:18px}
li{margin:4px 0}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--sub);font-weight:500;font-size:12px}
a{color:#0066cc}
.num{white-space:nowrap;text-align:right;font-variant-numeric:tabular-nums}
.tag{display:inline-block;white-space:nowrap;font-size:12px;background:#fff0f2;color:var(--red);border-radius:6px;padding:1px 7px;margin:2px 4px 2px 0}
.chip{display:inline-block;max-width:100%;font-size:12px;background:var(--bg);border-radius:6px;padding:2px 8px;margin:2px 4px 2px 0;color:#333}
.orig{color:var(--sub);font-size:12px}
.prod{border:1px solid var(--line);border-radius:12px;padding:14px;margin:12px 0}
.prod h3{font-size:15px;margin:0 0 6px}
.stats{font-size:13px;color:var(--sub);margin-bottom:8px}
.note{font-size:13px;background:#fafafa;border-left:3px solid var(--red);padding:6px 10px;margin-top:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.card{border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.card h3{font-size:15px;margin:0 0 4px}
.card p{margin:0 0 6px;font-size:14px}
.stale{font-size:11px;color:#b26a00;background:#fff6e6;border-radius:4px;padding:1px 5px;margin-left:4px}
.brands div{margin:4px 0}
footer{color:var(--sub);font-size:12px;text-align:center;padding:24px 0 40px}
.empty{color:var(--sub);padding:40px 0;text-align:center}
.hot td.t{min-width:280px}.chip .ko{color:#6e6e73;margin-left:4px}.dl{list-style:none;padding:0}.dl li{padding:6px 0;border-bottom:1px solid var(--line)}
.rl{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
.rl li{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:0}
.rl .q{font-weight:600;font-size:14px}.rl .q .ko{font-weight:400;color:var(--sub);margin-left:6px;font-size:13px}
.rl .d{font-size:13px;margin:4px 0 2px;color:#333}.rl .p{font-size:12px}
.dup{font-size:11px;color:var(--sub);background:var(--bg);border-radius:4px;padding:1px 5px;margin-left:4px;white-space:nowrap}
.mstat{display:none;font-size:12px;color:#444;margin-top:3px;white-space:nowrap}
@media(max-width:640px){.wrap{padding:0 12px}h1{font-size:17px}.top{padding:10px 0}.hot .num{display:none}.hot .mstat{display:block}.hot td.t{min-width:0}.hot th:nth-child(2),.hot td:nth-child(2){padding-left:2px;padding-right:2px}section{padding:16px 14px;margin:12px 0}.grid,.rl{grid-template-columns:1fr}table{font-size:13px}}
</style>
</head>
<body>
<header><div class="wrap">
  <div class="top">
    <h1><span class="logo">小红书</span> 중국 트렌드 브리핑</h1>
    <select id="date" aria-label="날짜 선택"></select>
  </div>
  <nav>
    <a href="#summary">핵심</a><a href="#hot">HOT TOP5</a><a href="#products">인기글·제품</a><a href="#brands">브랜드</a><a href="#sections">분야별</a><a href="#korea">한국 여행</a><a href="#dutyfree">면세</a><a href="#rising">검색어</a>
  </nav>
</div></header>
<main class="wrap" id="app"><div class="empty">불러오는 중…</div></main>
<footer class="wrap">출처: 샤오홍슈(rednote.com) 공개 게시물 · 매주 월~금 오전 7시 자동 갱신 · 좋아요 수는 수집 시점 기준</footer>
<script>
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const link=(t,u)=>u?`<a href="${esc(u)}" target="_blank" rel="noopener">${esc(t)}</a>`:esc(t);
async function loadIndex(){const r=await fetch('reports/index.json?_='+Date.now());return r.json()}
async function loadDay(d){const r=await fetch('reports/'+d+'.json?_='+Date.now());return r.json()}
function render(R){
  const chip=q=>Array.isArray(q)?`<span class="chip">${esc(q[0])}${q[1]?`<span class="ko">${esc(q[1])}</span>`:''}</span>`:`<span class="chip">${esc(q)}</span>`;
  const pid=u=>((u||'').match(/\/(?:explore|item)\/([0-9a-f]+)/)||[])[1]||u;
  const hotIds=new Map(R.hot.map((p,i)=>[pid(p.url),i+1]));
  const prodIds=new Map((R.products||[]).map((p,i)=>[pid(p.url),i+1]));
  const seen=id=>hotIds.has(id)?`HOT ${hotIds.get(id)}위`:prodIds.has(id)?`인기글 ${prodIds.get(id)}`:'';
  const rq=new Set((R.rising||[]).map(r=>Array.isArray(r)?r[0]:(r.q||r)));
  const plink=(p)=>{const s0=seen(pid(p[2]));return `${link(p[0],p[2])} <span class="orig" style="white-space:nowrap">❤️ ${esc(p[1])}</span>${s0?`<span class="dup">${s0}에도 있음</span>`:''}`};
  const h=[];
  h.push(`<section id="summary"><h2>① 오늘의 핵심 — ${esc(R.date)}</h2><ul>${R.summary.map(s=>`<li>${esc(s)}</li>`).join('')}</ul></section>`);
  h.push(`<section id="hot"><h2>② 🔥 HOT 게시물 TOP 5 <span class="orig">(전 분야 · 최근 7일 · 좋아요순)</span></h2><div class="tw"><table class="hot"><tr><th>#</th><th>분야</th><th>게시물 (한국어 / 중국어 원문)</th><th class="num">좋아요</th><th class="num">저장</th><th class="num">댓글</th><th class="num">게시</th></tr>${R.hot.map((p,i)=>`<tr><td>${i+1}</td><td><span class="tag">${esc(p.cat)}</span></td><td class="t">${link(p.title,p.url)}<div class="orig">${esc(p.orig||'')}</div><div class="mstat">❤️ ${esc(p.likes)} · ⭐ ${esc(p.saves||'-')} · 💬 ${esc(p.comments||'-')} · ${esc(p.date)}</div></td><td class="num">${esc(p.likes)}</td><td class="num">${esc(p.saves||'-')}</td><td class="num">${esc(p.comments||'-')}</td><td class="num">${esc(p.date)}</td></tr>`).join('')}</table></div></section>`);
  h.push(`<section id="products"><h2>③ 🏆 인기글 + 언급 제품</h2>${R.products.map((p,i)=>`<div class="prod"><h3>${i+1}. ${link(p.title,p.url)}${hotIds.has(pid(p.url))?`<span class="dup">HOT ${hotIds.get(pid(p.url))}위</span>`:''}</h3><div class="stats">❤️ ${esc(p.stats.likes)} · ⭐ 저장 ${esc(p.stats.saves)} · 💬 ${esc(p.stats.comments)} &nbsp; <span class="orig">${esc(p.tags||'')}</span></div><div class="tw"><table>${p.items.map(r=>`<tr><th style="width:90px;white-space:nowrap">${esc(r[0])}</th><td>${esc(r[1])}</td></tr>`).join('')}</table></div>${p.note?`<div class="note">${esc(p.note)}</div>`:''}</div>`).join('')}</section>`);
  h.push(`<section id="brands" class="brands"><h2>④ 📊 오늘 언급 많은 브랜드</h2>${Object.entries(R.brands).map(([k,v])=>`<div><b>${esc(k)}</b> &nbsp;${v.map(b=>chip(b)).join('')}</div>`).join('')}</section>`);
  h.push(`<section id="sections"><h2>⑤ 분야별 트렌드</h2><div class="grid">${R.sections.map(s=>{let ps=s.posts||[];const fresh=ps.filter(p=>!seen(pid(p[2])));if(fresh.length)ps=fresh;const ch=(s.searches||[]).filter(q=>!rq.has(Array.isArray(q)?q[0]:q));return `<div class="card"><h3>${esc(s.name)}${s.stale?'<span class="stale">최근 1주 외 포함</span>':''}</h3><p>${esc(s.trend)}</p>${ps.map(p=>`<div style="font-size:13px">▸ ${plink(p)}</div>`).join('')}${ch.length?`<div style="margin-top:6px">${ch.map(chip).join('')}</div>`:''}</div>`}).join('')}</div></section>`);
  h.push(`<section id="korea"><h2>⑥ 🇰🇷 한국 여행</h2><div class="grid">${R.korea.map(k=>`<div class="card"><h3>${esc(k.region)}</h3><p>${esc(k.trend)}</p><div style="font-size:13px">▸ ${plink(k.post)}</div><div style="margin-top:6px">${(k.searches||[]).filter(q=>!rq.has(Array.isArray(q)?q[0]:q)).map(chip).join('')}</div></div>`).join('')}</div></section>`);
  h.push(`<section id="dutyfree"><h2>⑦ 면세 관련</h2><ul class="dl">${R.dutyfree.map(d=>typeof d==='string'?`<li>${esc(d)}</li>`:`<li>${esc(d.text)}<div style="font-size:13px">▸ ${plink(d.post)}</div></li>`).join('')}</ul></section>`);
  const rit=r=>{const o=Array.isArray(r)?{q:r[0],ko:r[1],cat:r[2],desc:r[3]}:(typeof r==='string'?{q:r}:r);return `<li><div class="q">${esc(o.q)}${o.ko?`<span class="ko">${esc(o.ko)}</span>`:''}${o.cat?` <span class="tag">${esc(o.cat)}</span>`:''}</div>${o.desc?`<div class="d">${esc(o.desc)}</div>`:''}${o.post?`<div class="p">▸ ${plink(o.post)}</div>`:''}</li>`};
  h.push(`<section id="rising"><h2>⑧ 새로 뜨는 검색어 <span class="orig">(키워드별 무슨 내용인지)</span></h2><ul class="rl">${(R.rising||[]).map(rit).join('')}</ul>${R.notes?`<div class="note" style="margin-top:12px">${esc(R.notes)}</div>`:''}</section>`);
  document.getElementById('app').innerHTML=h.join('');
}
(async()=>{
  try{
    const idx=await loadIndex();const sel=document.getElementById('date');
    sel.innerHTML=idx.dates.map(d=>`<option>${d}</option>`).join('');
    const want=(location.hash.match(/^#d-(\d{4}-\d{2}-\d{2})$/)||[])[1];
    const d=idx.dates.includes(want)?want:idx.dates[0];sel.value=d;
    render(await loadDay(d));
    sel.onchange=async()=>{render(await loadDay(sel.value));history.replaceState(null,'','#d-'+sel.value)};
  }catch(e){document.getElementById('app').innerHTML='<div class="empty">리포트를 불러오지 못했습니다.</div>'}
})();
</script>
</body>
</html>
